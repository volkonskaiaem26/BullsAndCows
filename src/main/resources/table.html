<!DOCTYPE html>
<html>
<head>
  <title>Bulls and Cows</title>
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css";
        integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>;
  <script src="script.js"></script>
</head>
<body>
<div class="container">
  <div class="row">
    <div class="col-sm-6">
      <table id="numberTable" class="table table-bordered table-condensed table-striped">
        <thead>
        <tr>
          <th>Number</th>
          <th>Cows</th>
          <th>Bulls</th>
        </tr>
        </thead>
        <!-- tbody будет добавлен скриптом -->
      </table>
    </div>
  </div>

  <div class="form-group">
    <label>Number (4 digits)</label>
    <input type="text" id="number" class="form-control" maxlength="4" pattern="\d{4}" placeholder="1234"/>
  </div>

  <div class="row">
    <div class="col-xs-12">
      <button type="button" id="start" class="btn btn-primary" onclick="Start();">Start</button>
    </div>
  </div>
  <div class="row" style="margin-top: 10px;">
    <div class="col-xs-12">
      <button type="button" id="updateButton" class="btn btn-primary" onclick="updateClick();">Add</button>
    </div>
  </div>
</div>

<script>
  $(document).ready(function () {
  numberList(); // исправлено: было userList
  });
</script>
</body>
</html>
